<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350"><rect width="840" height="350" rx="10" fill="#fff"/><g font-family="Arial,sans-serif" fill="#233745"><text x="20" y="24" font-size="14" font-weight="bold">Audible operator feedback</text><text x="820" y="24" text-anchor="end" font-size="11">Default base: 2700 Hz · warning: 250 ms</text><text x="20" y="54" font-size="13" font-weight="bold" fill="#3479bd">Workflow start</text><text x="20" y="69" font-size="10">Two rising notes</text><path d="M210 77 H590" stroke="#d5dee4"/><rect x="210" y="61.45" width="37.5" height="4" rx="2" fill="#3479bd"/><rect x="267.5" y="53.35" width="75" height="4" rx="2" fill="#3479bd"/><text x="610" y="62" font-size="11">1755 / 2565 Hz</text><text x="20" y="102" font-size="13" font-weight="bold" fill="#19805b">Accepted scan</text><text x="20" y="117" font-size="10">Short chirp</text><path d="M210 125 H590" stroke="#d5dee4"/><rect x="210" y="93.25" width="27.5" height="4" rx="2" fill="#19805b"/><text x="610" y="110" font-size="11">3375 Hz</text><text x="20" y="150" font-size="13" font-weight="bold" fill="#b33232">Rejected scan</text><text x="20" y="165" font-size="10">Low warning</text><path d="M210 173 H590" stroke="#d5dee4"/><rect x="210" y="162.85" width="125" height="4" rx="2" fill="#b33232"/><text x="610" y="158" font-size="11">1215 Hz</text><text x="20" y="198" font-size="13" font-weight="bold" fill="#b7791f">Timeout</text><text x="20" y="213" font-size="10">Double warning</text><path d="M210 221 H590" stroke="#d5dee4"/><rect x="210" y="210.85" width="125" height="4" rx="2" fill="#b7791f"/><rect x="460" y="210.85" width="125" height="4" rx="2" fill="#b7791f"/><text x="610" y="206" font-size="11">1215 / 1215 Hz</text><text x="20" y="246" font-size="13" font-weight="bold" fill="#19805b">Complete / PASS</text><text x="20" y="261" font-size="10">Rising completion</text><path d="M210 269 H590" stroke="#d5dee4"/><rect x="210" y="249.4" width="45" height="4" rx="2" fill="#19805b"/><rect x="277.5" y="244" width="45" height="4" rx="2" fill="#19805b"/><rect x="345" y="237.25" width="90" height="4" rx="2" fill="#19805b"/><text x="610" y="254" font-size="11">2160 / 2700 / 3375 Hz</text><text x="20" y="294" font-size="13" font-weight="bold" fill="#b33232">Complete / FAIL</text><text x="20" y="309" font-size="10">Low descending notes</text><path d="M210 317 H590" stroke="#d5dee4"/><rect x="210" y="304.15" width="65" height="4" rx="2" fill="#b33232"/><rect x="302.5" y="308.2" width="65" height="4" rx="2" fill="#b33232"/><rect x="395" y="310.9" width="120" height="4" rx="2" fill="#b33232"/><text x="610" y="302" font-size="11">1485 / 1080 / 810 Hz</text><text x="20" y="338" font-size="10">Pitch is vertical; duration is horizontal. Volume is literal 0–10% duty. Frequencies scale with the configured base.</text></g></svg>
