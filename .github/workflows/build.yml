name: Firmware and regression tests
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.18
      - run: python -m unittest discover -s test/unit -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/unit/test_parser.js
      - run: python tools/embed_web.py && git diff --exit-code src/web_assets.h
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: esp32cam-firmware
          path: .pio/build/esp32cam/firmware.bin
