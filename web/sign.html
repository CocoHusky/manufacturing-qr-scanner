<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator sign-off</title><style>body{font:16px system-ui;background:#f4f6f8;color:#182330;max-width:550px;margin:24px auto;padding:16px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:10px}input,select{width:95%}canvas{border:1px solid #aaa;background:white;width:100%;touch-action:none}#qr{background:white;padding:12px;text-align:center}#qr img{max-width:100%;image-rendering:pixelated}</style></head><body><h1>Operator sign-off</h1><label>Operator name<input id="name" maxlength="80"></label><label>Part or lot<input id="part" maxlength="80"></label><label>Action<select id="action"><option>Inspected</option><option>Assembled</option><option>Tested</option><option>Approved</option><option>Rejected</option></select></label><label>Signature</label><canvas id="sig" width="600" height="200"></canvas><p><button id="clear">Clear</button> <button id="create">Sign and generate QR</button></p><p id="status"></p><div id="qr"></div><p>Prototype sign-off; self-entered identity, not a cryptographic or authenticated signature.</p><script src="/qrcode.js"></script><script>
const $=id=>document.getElementById(id),c=$('sig'),g=c.getContext('2d');let drawing=false,signed=false;g.lineWidth=3;g.lineCap='round';function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);g.beginPath();g.moveTo(...point(e))};c.onpointermove=e=>{if(drawing){g.lineTo(...point(e));g.stroke();signed=true}};c.onpointerup=c.onpointercancel=()=>drawing=false;$('clear').onclick=()=>{g.clearRect(0,0,c.width,c.height);signed=false;$('qr').replaceChildren()};$('create').onclick=async()=>{if(!$('name').value.trim()||!signed){$('status').textContent='Enter name and sign first';return}if(!$('part').value.trim()){$('status').textContent='Enter part or lot';return}let data={operator:$('name').value.trim(),part:$('part').value.trim(),action:$('action').value,timestamp:new Date().toISOString(),signature:c.toDataURL('image/png')};$('create').disabled=true;try{let r=await fetch('/sign-record',{method:'POST',body:new URLSearchParams(data)});if(!r.ok)throw Error(await r.text());let id=await r.text(),q=qrcode(0,'M');q.addData('id='+id);q.make();$('qr').innerHTML=q.createImgTag(8,32);$('status').textContent='Saved · '+id+' · '+data.timestamp}catch(e){$('status').textContent=e.message}finally{$('create').disabled=false}};
</script></body></html>
