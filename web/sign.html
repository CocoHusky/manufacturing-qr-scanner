<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator sign-on</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:#202b33;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:360px;margin:48px auto;padding:18px;background:white;border:1px solid #dfe4e8;border-radius:8px}h1{font-size:20px;font-weight:650;letter-spacing:-.025em;margin:0 0 14px}label{display:block;font-size:12px;font-weight:550;margin:10px 0 4px}input,button{font:inherit;border:1px solid #dfe4e8;border-radius:5px;padding:7px 9px;min-height:32px}input{width:100%}button{cursor:pointer}button.primary{width:100%;margin-top:14px;background:#17665d;color:#fff;border-color:#17665d;font-weight:600}small{font-size:11px;color:#65717c}#status{overflow-wrap:anywhere}input:focus-visible,button:focus-visible{outline:2px solid #17665d;outline-offset:1px}@media(max-width:420px){main{margin:20px 10px}}</style></head><body><main><h1>Operator sign-on</h1><form id="form"><label for="name">User name</label><input id="name" required maxlength="40" autocomplete="name"><label for="department">Department</label><input id="department" required maxlength="32" placeholder="e.g. Quality"><label for="test">Test</label><input id="test" required maxlength="48" placeholder="e.g. PCB inspection"><button class="primary" type="submit">Start scanning</button></form><p id="status" role="status"></p><div id="qr"></div><p><small>Self-reported test sign-in, not identity authentication.</small></p></main><script>
document.getElementById('form').onsubmit=async e=>{e.preventDefault();let name=document.getElementById('name').value.trim(),department=document.getElementById('department').value.trim(),test=document.getElementById('test').value.trim();if(!name||!department||!test)return;let session={name,department,test,startedAt:new Date().toISOString()};try{let r=await fetch('/session',{method:'POST',body:new URLSearchParams(session)});if(!r.ok)throw Error(await r.text());sessionStorage.setItem('scanner.session',JSON.stringify(session));location.replace('/')}catch(e){document.getElementById('status').textContent=e.message}};
</script></body></html>
