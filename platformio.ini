[env:esp32cam]
platform = espressif32@6.13.0
board = esp32cam
framework = arduino
board_build.partitions = partitions.csv
board_upload.maximum_size = 1835008
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11 -fno-exceptions
build_flags = -DBOARD_HAS_PSRAM -std=gnu++17 -fexceptions
